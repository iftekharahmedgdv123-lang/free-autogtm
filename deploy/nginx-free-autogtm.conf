# Free AutoGTM — change server_name to your subdomain, e.g. tool.iftekhar.ami.bd
server {
    listen 80;
    server_name tool.iftekhar.ami.bd;

    # Password protection — required. Created by deploy/install.sh
    auth_basic "Free AutoGTM";
    auth_basic_user_file /etc/nginx/.free-autogtm-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
